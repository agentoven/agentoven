name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight; every push to main keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # macOS runners ship Python 3.14, newer than the newest PyO3 0.22 supports; build against the stable ABI
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  RUSTFLAGS: -Dwarnings

jobs:
  # ── Rust ─────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Each step runs even when an earlier one failed, so one run reports every Rust problem
      # (a format failure used to hide the clippy and test results behind it).
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        if: ${{ !cancelled() }}
        run: cargo build --workspace

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace

  # ── Go Control Plane ─────────────────────────────────────────
  go:
    name: Go Control Plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: control-plane/go.sum

      - name: Build
        working-directory: control-plane
        run: go build ./...

      - name: Test
        working-directory: control-plane
        run: go test ./...

      - name: Vet
        working-directory: control-plane
        run: go vet ./...

  # ── Go Integration Tests ─────────────────────────────────────
  go-integration:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    needs: [go, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: control-plane/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dashboard
        working-directory: control-plane/dashboard
        run: npm ci && npm run build

      - name: Build server
        working-directory: control-plane
        run: go build -o agentoven-server ./cmd/server

      - name: Run integration tests
        working-directory: control-plane
        env:
          # The smoke test registers a tool at localhost:3001; the egress guard refuses loopback
          # tool endpoints unless the host is allowed (ADR-0037).
          AGENTOVEN_TOOL_EGRESS_ALLOW: localhost
          # The server keeps its snapshot and keys here, not in the runner's home.
          AGENTOVEN_DATA_DIR: ${{ runner.temp }}/agentoven-data
        run: |
          # Start the server in the background (in-memory store, no PG needed).
          ./agentoven-server > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          if ! ../scripts/ci/control-plane-smoke.sh http://localhost:8080; then
            echo "::group::server log"
            cat "$RUNNER_TEMP/server.log"
            echo "::endgroup::"
            exit 1
          fi

  # ── Dashboard ────────────────────────────────────────────────
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: control-plane/dashboard
        run: npm ci

      - name: Type check
        working-directory: control-plane/dashboard
        run: npx tsc --noEmit

      - name: Build
        working-directory: control-plane/dashboard
        run: npm run build

  # ── Python SDK ───────────────────────────────────────────────
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        working-directory: sdk/python
        run: maturin build --release

      - name: Install and test
        run: |
          pip install target/wheels/*.whl
          python -c "import agentoven; print(agentoven.__version__)"

  # ── TypeScript SDK ───────────────────────────────────────────
  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install

      - name: Build native module
        working-directory: sdk/typescript
        run: npm run build

  # ── Docker ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build control plane image
        run: docker build -t agentoven-server:test ./control-plane
