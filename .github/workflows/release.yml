name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.27'

jobs:
  # ── Preflight: optional publish secrets and "is this the newest release?" ──
  #
  # A registry token that is not set must not turn the whole release red: the publish job that
  # needs it is skipped, with a warning annotation and a line in the run summary, and everything
  # else (binaries, image, GitHub Release) still ships. A token that IS set and is rejected by the
  # registry still fails its job: that is a real problem and stays visible.
  #
  # The same job decides whether this tag may move the "latest" markers (the GitHub Release
  # "Latest" badge, the :latest image tag). Pushing an old version tag (a back-fill) must not.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      pypi: ${{ steps.tokens.outputs.pypi }}
      crates: ${{ steps.tokens.outputs.crates }}
      homebrew: ${{ steps.tokens.outputs.homebrew }}
      latest: ${{ steps.latest.outputs.latest }}
      prerelease: ${{ steps.latest.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check optional publish secrets
        id: tokens
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          check() { # output-name, secret-name, secret-value, what-is-skipped
            if [ -n "$3" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "- $2 is set: $4 will run" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=$2 is not set::$4 is skipped. Add the repository secret $2 and re-run the workflow to publish."
              echo "- **$2 is not set: $4 is skipped.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          {
            echo "### Optional publish secrets"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          check pypi     PYPI_TOKEN           "$PYPI_TOKEN"           "Publish Python SDK (PyPI)"
          check crates   CARGO_REGISTRY_TOKEN "$CARGO_REGISTRY_TOKEN" "Publish Rust crates (crates.io)"
          check homebrew HOMEBREW_TAP_TOKEN   "$HOMEBREW_TAP_TOKEN"   "Update Homebrew Formula"

      - name: Is this the newest release?
        id: latest
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            # v1.2.3-rc.1 and friends are pre-releases and never "latest".
            LATEST=false
            PRERELEASE=true
          else
            PRERELEASE=false
            HIGHEST=$(git tag -l 'v[0-9]*' | grep -v -- '-' | sort -V | tail -n 1)
            if [ "$HIGHEST" = "$TAG" ]; then LATEST=true; else LATEST=false; fi
            echo "highest stable tag: $HIGHEST"
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "- $TAG: latest=$LATEST, prerelease=$PRERELEASE" >> "$GITHUB_STEP_SUMMARY"

  # ── Build CLI binaries (Rust) ────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p agentoven-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/agentoven${{ matrix.ext }} dist/agentoven-${{ matrix.target }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: agentoven-${{ matrix.target }}
          path: dist/

  # ── Build Go server binaries ─────────────────────────────────
  server:
    name: Server (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
          - goos: linux
            goarch: arm64
            os: ubuntu-latest
          - goos: darwin
            goarch: amd64
            os: macos-latest
          - goos: darwin
            goarch: arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: control-plane/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build dashboard
        working-directory: control-plane/dashboard
        run: |
          npm ci
          npm run build

      - name: Build server
        working-directory: control-plane
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o ../dist/agentoven-server-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: agentoven-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ── Python wheels ────────────────────────────────────────────
  python-wheels:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — manylinux (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          # Linux aarch64 — manylinux (glibc)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: '2_28'
          # Linux x86_64 — musl (Alpine)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-15-intel
            manylinux: ''
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            manylinux: ''
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            manylinux: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/python
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sdk/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # Only the interpreters the pinned PyO3 supports; the images also carry newer ones.
          args: --release --out dist --interpreter python3.9 python3.10 python3.11 python3.12 python3.13
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.target }}
          path: sdk/python/dist/*.whl
          if-no-files-found: error

  # ── Python sdist ──────────────────────────────────────────────
  python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sdk/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: sdk/python/dist/*.tar.gz
          if-no-files-found: error

  # ── Publish Python SDK to PyPI ────────────────────────────────
  python-publish:
    name: Publish Python SDK
    needs: [preflight, python-wheels, python-sdist]
    # Skipped (with a warning from the preflight job) when PYPI_TOKEN is not set.
    if: needs.preflight.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-*
          merge-multiple: true
      - name: Upload to PyPI
        run: |
          pip install twine
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── Publish Rust crates to crates.io ────────────────────────
  crates-publish:
    name: Publish Rust crates
    needs: [preflight]
    # Skipped (with a warning from the preflight job) when CARGO_REGISTRY_TOKEN is not set.
    if: needs.preflight.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # In dependency order. A crate version is published once, so a re-run of the same tag
          # skips the crates that are already on crates.io instead of failing on them.
          for crate in a2a-ao agentoven-core agentoven-cli; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'agentoven-release-ci' \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "$code" = "200" ]; then
              echo "$crate $version is already on crates.io: skipping"
              continue
            fi
            cargo publish -p "$crate" --no-verify
            # Let the index pick the crate up before the next one depends on it.
            sleep 30
          done

  # ── Build & push Docker image to GHCR ─────────────────────────
  docker:
    name: Docker Image
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          push: true
          platforms: linux/amd64,linux/arm64
          # :latest only moves for the newest stable release (an old tag must not move it back).
          tags: |
            ghcr.io/agentoven/agentoven:${{ steps.version.outputs.version }}
            ${{ needs.preflight.outputs.latest == 'true' && 'ghcr.io/agentoven/agentoven:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build TypeScript SDK native binaries ─────────────────────
  typescript-sdk:
    name: TypeScript SDK (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/typescript/native

      - name: Install cross-compilation tools (Linux)
        if: contains(matrix.settings.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build native module
        working-directory: sdk/typescript
        run: |
          npx napi build --platform --release --target ${{ matrix.settings.target }} --cargo-cwd ./native
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-bindings-${{ matrix.settings.target }}
          path: sdk/typescript/*.node
          if-no-files-found: error

      # The loader napi generates is the same for every target; take it from one build.
      - uses: actions/upload-artifact@v4
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        with:
          name: sdk-bindings-loader
          path: |
            sdk/typescript/index.js
            sdk/typescript/index.d.ts
          if-no-files-found: error

  # ── Publish @agentoven/sdk to npm ────────────────────────────
  npm-publish:
    name: Publish npm
    needs: [typescript-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # The SDK is published to GitHub Packages (scope @agentoven), not npmjs.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@agentoven'

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Download all native bindings
        uses: actions/download-artifact@v4
        with:
          path: sdk/typescript/artifacts
          pattern: sdk-bindings-*
          merge-multiple: true

      - name: Create per-platform package folders
        working-directory: sdk/typescript
        run: npx napi create-npm-dir -t .

      - name: Move artifacts
        working-directory: sdk/typescript
        run: npx napi artifacts --dir artifacts

      - name: Use the generated loader
        working-directory: sdk/typescript
        run: cp artifacts/index.js artifacts/index.d.ts .

      - name: Build TypeScript
        working-directory: sdk/typescript
        run: npx tsc

      - name: Publish
        working-directory: sdk/typescript
        run: |
          # Per-platform packages first. A package version cannot be published twice, so on a
          # re-run of the same tag this reports the existing ones and carries on.
          npx napi prepublish -t npm --skip-gh-release || echo "prepublish: some platform packages already exist"
          # prepublishOnly would run the step above a second time.
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Create GitHub Release ────────────────────────────────────
  #
  # Runs whenever the CLI and server binaries were built, even if a registry publish (PyPI,
  # crates.io, npm, GHCR) failed or was skipped, so a pushed v* tag always gets a GitHub Release
  # with whatever artifacts were built. The job summary lists what did not publish.
  release:
    name: Create Release
    needs:
      - preflight
      - cli
      - server
      - python-wheels
      - python-sdist
      - typescript-sdk
      - python-publish
      - docker
      - npm-publish
      - crates-publish
    if: ${{ always() && needs.cli.result == 'success' && needs.server.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Summarise the pipeline
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Release pipeline"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | select(.key != "preflight") | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "::warning title=\(.key) did not publish::result: \(.value.result)"'

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            # Use heredoc delimiter for multiline
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            {
              echo "body<<$EOF"
              echo "$NOTES"
              echo "$EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/**/*
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          # Only the newest stable tag is marked Latest; an old tag pushed later never takes it back.
          make_latest: ${{ needs.preflight.outputs.latest }}
          prerelease: ${{ needs.preflight.outputs.prerelease }}

  # ── Update Homebrew tap ──────────────────────────────────────
  homebrew:
    name: Update Homebrew Formula
    needs: [preflight, release]
    # Only for the newest stable release (the formula must not be moved back to an old tag), and
    # skipped (with a warning from the preflight job) when HOMEBREW_TAP_TOKEN is not set.
    if: >-
      ${{ always()
      && needs.release.result == 'success'
      && needs.preflight.outputs.homebrew == 'true'
      && needs.preflight.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download source tarball and compute SHA
        id: sha
        run: |
          curl -fsSL "https://github.com/agentoven/agentoven/archive/refs/tags/${GITHUB_REF#refs/tags/}.tar.gz" \
            -o source.tar.gz
          echo "sha256=$(shasum -a 256 source.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: agentoven/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          sed -i "s|url \".*\"|url \"https://github.com/agentoven/agentoven/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz\"|" Formula/agentoven.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha.outputs.sha256 }}\"|" Formula/agentoven.rb

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agentoven.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${{ steps.version.outputs.version }}: nothing to commit"
          else
            git commit -m "agentoven ${{ steps.version.outputs.version }}"
            git push
          fi
