# AgentOven — Local Development Stack
#
# PostgreSQL is provided by the SHARED workspace compose file.
# Start it first from the workspace root:
#   cd .. && docker compose up -d postgres
#
# Then here:
#   docker compose up -d          # Start server + observability stack
#   docker compose logs -f server # Watch server logs
#   docker compose down           # Stop (postgres keeps running — shared)
#
# Services:
#   - server:   AgentOven control plane (Go)   → http://localhost:8080
#   - jaeger:   Jaeger (traces)                → http://localhost:16686
#   - otel:     OpenTelemetry Collector        → gRPC :4317, Prometheus :8889

services:
  # ── AgentOven Control Plane ──────────────────────────────────
  server:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    environment:
      AGENTOVEN_PORT: "8080"
      DATABASE_URL: "postgres://agentoven:agentoven@shared-postgres:5432/agentoven?sslmode=disable"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_SERVICE_NAME: "agentoven-control-plane"
    ports:
      - "8080:8080"
    networks:
      - default
      - shared
    restart: unless-stopped

  # ── OpenTelemetry Collector ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector self-metrics
      - "8889:8889"   # Prometheus scrape endpoint (agentoven.* metrics)
    depends_on:
      - jaeger

  # ── Jaeger (Distributed Tracing UI) ─────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Accept traces from OTel Collector
      - "14250:14250"  # gRPC
    restart: unless-stopped

  # ── Ollama (LlamaGuard / local model inference) ─────────────
  # CPU-only sidecar.  Use llama-guard3:1b for ~700 MB RAM footprint.
  # To enable: docker compose --profile guardrails up -d
  # First-run model pull (one-time):
  #   docker compose exec ollama ollama pull llama-guard3:1b
  ollama:
    image: ollama/ollama:latest
    profiles: ["guardrails"]
    volumes:
      - ollama_data:/root/.ollama
    # No GPU required for 1B model — CPU inference is fast enough.
    # Add the block below to enable GPU passthrough if available:
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: 1
    #             capabilities: [gpu]
    ports:
      - "11434:11434"  # OpenAI-compat endpoint for host access
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"   # keep model warm between requests
      OLLAMA_NUM_PARALLEL: "2"   # allow 2 concurrent guardrail evaluations

volumes:
  ollama_data: {}   # persist downloaded models across restarts

networks:
  default: {}
  # Shared network created by the workspace root docker-compose.yml.
  # The shared-postgres container lives on this network.
  shared:
    external: true
    name: agentoven-ws_default
