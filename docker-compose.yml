# AgentOven — Local Development Stack
#
# PostgreSQL is provided by the SHARED workspace compose file.
# Start it first from the workspace root:
#   cd .. && docker compose up -d postgres
#
# Then here:
#   docker compose up -d          # Start server + observability stack
#   docker compose logs -f server # Watch server logs
#   docker compose down           # Stop (postgres keeps running — shared)
#
# Services:
#   - server:   AgentOven control plane (Go)   → http://localhost:8080
#   - jaeger:   Jaeger (traces)                → http://localhost:16686
#   - otel:     OpenTelemetry Collector        → gRPC :4317

services:
  # ── AgentOven Control Plane ──────────────────────────────────
  server:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    environment:
      AGENTOVEN_PORT: "8080"
      DATABASE_URL: "postgres://agentoven:agentoven@shared-postgres:5432/agentoven?sslmode=disable"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_SERVICE_NAME: "agentoven-control-plane"
    ports:
      - "8080:8080"
    networks:
      - default
      - shared
    restart: unless-stopped

  # ── OpenTelemetry Collector ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Metrics
    depends_on:
      - jaeger

  # ── Jaeger (Distributed Tracing UI) ─────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Accept traces from OTel Collector
      - "14250:14250"  # gRPC
    restart: unless-stopped

networks:
  default: {}
  # Shared network created by the workspace root docker-compose.yml.
  # The shared-postgres container lives on this network.
  shared:
    external: true
    name: agentoven-ws_default
