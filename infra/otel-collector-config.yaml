receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  resource:
    attributes:
      - key: service.namespace
        value: agentoven
        action: upsert

exporters:
  # Export to Jaeger via OTLP
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus scrape endpoint for canonical AgentOven metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: agentoven

  # Optional external OTLP sink for traces/metrics/logs.
  # Set OTEL_SINK_ENDPOINT to enable forwarding.
  otlphttp/custom:
    endpoint: ${env:OTEL_SINK_ENDPOINT}
    headers:
      X-Sink-Token: ${env:OTEL_SINK_TOKEN}
    sending_queue:
      enabled: true
      num_consumers: 4
    retry_on_failure:
      enabled: true

  # Log to stdout for debugging
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]

    traces/external:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/custom]

    metrics/external:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/custom]

    logs/external:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/custom]
